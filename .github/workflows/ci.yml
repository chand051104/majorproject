name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q backend
          node --check frontend/map.js

      - name: Run tests without remote imagery calls
        env:
          URBANGUARD_TILE_ENABLED: "false"
          URBANGUARD_SENTINEL_ENABLED: "false"
        run: python -m pytest -q
